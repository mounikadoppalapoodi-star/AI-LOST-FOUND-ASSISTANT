version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: ai_lost_found_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai_lost_found_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
